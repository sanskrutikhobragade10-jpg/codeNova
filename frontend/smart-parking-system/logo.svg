<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="metroOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#f35000" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#091b2e" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b8a44" />
      <stop offset="100%" stop-color="#0f5c2b" />
    </linearGradient>
  </defs>

  <!-- Top Orange Metro Arch -->
  <path d="M 160 160 C 180 80, 320 80, 340 160" fill="none" stroke="url(#metroOrange)" stroke-width="14" stroke-linecap="round"/>

  <!-- Metro Train on Top Curve -->
  <g transform="translate(180, 75)">
    <!-- Rail Bridge Track -->
    <path d="M -40 85 Q 70 20 180 85" fill="none" stroke="#0f2b48" stroke-width="12" stroke-linecap="round"/>
    <!-- Pillar struts -->
    <line x1="-20" y1="85" x2="-20" y2="120" stroke="#0f2b48" stroke-width="6"/>
    <line x1="10" y1="70" x2="10" y2="115" stroke="#0f2b48" stroke-width="6"/>
    <line x1="40" y1="58" x2="40" y2="110" stroke="#0f2b48" stroke-width="6"/>
    
    <!-- Train Body -->
    <path d="M -15 65 Q 40 15 125 45 L 140 70 Q 70 45 -15 75 Z" fill="#ffffff" stroke="#0f2b48" stroke-width="4"/>
    <path d="M -10 65 Q 40 22 120 48" fill="none" stroke="url(#metroOrange)" stroke-width="6"/>
    <!-- Train Windows -->
    <path d="M 5 57 Q 35 30 75 42 L 72 50 Q 35 40 5 62 Z" fill="#0f2b48"/>
    <path d="M 85 45 Q 105 48 122 55 L 118 63 Q 102 56 83 52 Z" fill="#0f2b48"/>
  </g>

  <!-- Location Pin & Big 'P' Emblem -->
  <!-- Location Pin Base (Green Shield / Pin Point) -->
  <path d="M 160 220 L 250 380 L 340 220 C 350 200, 350 170, 330 160 Z" fill="url(#greenGrad)"/>

  <!-- Big Navy Letter P / Parking Pin Shape -->
  <path d="M 180 170 L 320 170 C 370 170, 370 270, 310 270 L 250 270 L 250 350 L 180 350 Z" fill="url(#navyGrad)"/>
  <!-- P Inner Hole -->
  <path d="M 240 205 L 295 205 C 315 205, 315 235, 295 235 L 240 235 Z" fill="#ffffff"/>

  <!-- Road Swoosh Under Scooter -->
  <path d="M 150 315 Q 250 300 350 250" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M 155 320 Q 250 305 345 258" fill="none" stroke="#0f2b48" stroke-width="5" stroke-linecap="round"/>

  <!-- Scooter (Two-Wheeler) in Front of P -->
  <g transform="translate(155, 210)">
    <!-- Rear Wheel -->
    <circle cx="35" cy="110" r="18" fill="#0f2b48" stroke="#ffffff" stroke-width="3"/>
    <circle cx="35" cy="110" r="8" fill="#ffffff"/>
    
    <!-- Front Wheel -->
    <circle cx="105" cy="115" r="14" fill="#0f2b48" stroke="#ffffff" stroke-width="3"/>
    <circle cx="105" cy="115" r="6" fill="#ffffff"/>

    <!-- Scooter Body & Seat -->
    <path d="M 25 105 C 20 85, 45 70, 65 75 L 75 95 L 90 95 L 98 60 L 88 50" fill="none" stroke="#0f2b48" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Seat -->
    <path d="M 35 70 C 45 68, 65 70, 70 78 Z" fill="#0f2b48"/>
    <!-- Handlebar & Headlight -->
    <path d="M 88 50 L 102 48" stroke="#0f2b48" stroke-width="6" stroke-linecap="round"/>
    <circle cx="103" cy="48" r="5" fill="#ff7a00"/>
    <circle cx="85" cy="40" r="4" fill="#0f2b48"/>
    <!-- Body Panel Highlight -->
    <path d="M 35 95 C 40 80, 60 80, 68 95 Z" fill="#ffffff"/>
  </g>

  <!-- Typography: METROPARK -->
  <g transform="translate(250, 425)" text-anchor="middle">
    <text x="-48" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="#0f2b48" letter-spacing="2">METRO</text>
    <text x="68" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="#1b8a44" letter-spacing="2">PARK</text>
    
    <!-- Subtitle: PARK SMART. RIDE EASY. -->
    <line x1="-190" y1="22" x2="-145" y2="22" stroke="#1b8a44" stroke-width="3"/>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#0f2b48" letter-spacing="4">PARK SMART. RIDE EASY.</text>
    <line x1="145" y1="22" x2="190" y2="22" stroke="#1b8a44" stroke-width="3"/>
  </g>
</svg>
